<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI小说创作平台</title>
  <script src="https://cdn.tailwindcss.com/3.4.14"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: Georgia, serif;
      background-color: #F9F7F4;
      color: #1a1a1a;
      min-height: 100vh;
      margin: 0;
    }
    
    /* 颗粒噪点背景 */
    .noise-bg {
      position: relative;
    }
    .noise-bg::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }
    
    /* 新粗野主义卡片样式 */
    .brutalist-card {
      background: white;
      border: 3px solid black;
      border-radius: 4px 4px 16px 4px;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.08);
      position: relative;
    }
    
    .brutalist-card::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border: 3px solid transparent;
      border-radius: 4px 4px 16px 4px;
      pointer-events: none;
    }
    
    /* 按钮样式 */
    .brutalist-btn {
      background: #F97316;
      border: 2px solid black;
      color: white;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      position: relative;
    }
    
    .brutalist-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
    }
    
    .brutalist-btn:active {
      transform: translate(0, 0);
      box-shadow: none;
    }
    
    .brutalist-btn-secondary {
      background: white;
      border: 2px solid black;
      color: #1a1a1a;
    }
    
    .brutalist-btn-secondary:hover {
      background: #f0f0f0;
    }
    
    /* 输入框样式 */
    .brutalist-input {
      background: #FFF8F0;
      border: 2px solid black;
      padding: 8px 12px;
      font-family: Georgia, serif;
      transition: all 0.2s ease;
    }
    
    .brutalist-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3);
    }
    
    /* 侧边栏样式 */
    .sidebar-bg {
      background: #2A4B5C;
      color: white;
    }
    
    /* 章节样式 */
    .chapter-card {
      background: #FFFEF9;
      border-left: 4px solid #F97316;
      padding-left: 16px;
    }
    
    /* 滚动条 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }
  </style>
</head>
<body class="noise-bg">
  <div id="root"></div>
  
  <script type="text/babel">
    // 全局常量
    const AI_MODEL = 'glm-4.7-flash';
    const API_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    const STORAGE_LIMIT = 5 * 1024 * 1024; // 5MB
    const FORBIDDEN_WORDS = ['然而', '因此', '总而言之', '值得注意的是', '不可否认', '在一定程度上', '众所周知'];
    
    // 类型定义
    interface Character {
      id: string;
      name: string;
      identity: string;
      skills: string[];
      personality: string[];
      speechStyle: string;
      status: string[];
      statusHistory: { timestamp: number; status: string }[];
    }
    
    interface Foreshadowing {
      id: string;
      content: string;
      chapter: number;
      isCollected: boolean;
      createdAt: number;
    }
    
    interface Beat {
      id: string;
      step: string;
      emotion: string;
      wordCount: number;
    }
    
    interface Chapter {
      index: number;
      content: string;
      beats: Beat[];
      timestamp: number;
      wordCount: number;
    }
    
    interface Novel {
      id: string;
      title: string;
      characters: Character[];
      worldSetting: string;
      outline: string;
      foreshadowing: Foreshadowing[];
      chapters: Chapter[];
      createdAt: number;
      updatedAt: number;
    }
    
    interface StyleSample {
      id: string;
      name: string;
      content: string;
      enabled: boolean;
    }
    
    interface AppState {
      novels: Record<string, Novel>;
      activeNovelId: string | null;
      mode: 'active' | 'auto';
      isAutoRunning: boolean;
      beats: { beats: Beat[]; summary: string } | null;
      showBeatEditor: boolean;
      isGenerating: boolean;
      progress: number;
      tellSentences: { original: string; rewrite: string; status: 'pending' | 'adopted' | 'skipped'; id: string }[];
      showTellPanel: boolean;
      sidebarCollapsed: boolean;
      rightPanelTab: 'tell' | 'foreshadowing';
      apiKey: string;
      styleSamples: StyleSample[];
      customPrompt: string;
      showSettings: boolean;
      showNovelManager: boolean;
      abortController: AbortController | null;
    }
    
    // Mock数据生成
    const generateMockBeats = () => ({
      beats: [
        { id: '1', step: '主角发现神秘线索', emotion: '疑惑', wordCount: 200 },
        { id: '2', step: '遭遇敌人伏击', emotion: '紧张', wordCount: 300 },
        { id: '3', step: '揭开真相一角', emotion: '震惊', wordCount: 250 },
      ],
      summary: '主角在调查中发现关键线索，却遭遇伏击，最终在危机中发现惊人真相。'
    });
    
    const generateMockContent = () => `林辰握紧手中的青铜钥匙，指腹能清晰感受到钥匙表面古老的纹路。窗外的雨丝斜斜划过玻璃，在昏黄的灯光下织成一片朦胧的帘幕。
    
"这把钥匙..."他低声自语，指尖摩挲着钥匙柄上刻着的奇异符号。空气中弥漫着旧纸张特有的霉味，混合着窗外飘进来的湿润泥土气息。

突然，门外传来一阵急促的脚步声。林辰警觉地站起身，顺手将钥匙塞进衣兜。脚步声在门前停下，紧接着是三下有节奏的敲门声。

他走到门边，透过猫眼向外望去。走廊里的灯光不知何时熄灭了，只能看到一个模糊的身影站在门口。

"谁？"林辰的声音带着一丝不易察觉的紧绷。

门外沉默了片刻，一个沙哑的声音响起："是我，老周。有急事找你。"

林辰犹豫了一下，还是打开了门。门外的老人浑身湿透，雨水顺着花白的头发滴落，在脚下形成一小片水洼。他的眼神中带着一种难以言喻的恐惧，嘴唇微微颤抖着。

"他们...他们来了。"老周的声音低得几乎听不见，"你必须马上离开这里。"`;
    
    const generateMockRewrite = (sentence) => {
      const rewrites = [
        sentence.replace(/感到|觉得/g, ''),
        sentence.replace(/非常|很|特别\s+/g, ''),
        sentence.replace(/脸上露出(.*?)表情/, '$1爬上面颊'),
        sentence.replace(/心里(.*?)/, '胸腔里$1'),
        sentence + '（改写：用动作描写替代直接陈述）'
      ];
      return rewrites[Math.floor(Math.random() * rewrites.length)];
    };
    
    // 创建新小说
    const createNewNovel = (title) => ({
      id: Date.now().toString(),
      title: title || '我的新小说',
      characters: [{
        id: '1',
        name: '林辰',
        identity: '前刑警，现为私家侦探',
        skills: ['推理', '格斗'],
        personality: ['冷静', '睿智', '观察力敏锐'],
        speechStyle: '沉稳、理性',
        status: ['健康', '单身', '在城市'],
        statusHistory: [{ timestamp: Date.now(), status: '健康，单身，在城市' }]
      }],
      worldSetting: '现代都市，存在超自然现象但不为人知',
      outline: '故事讲述主角林辰在调查一起神秘案件时，逐渐揭开了隐藏在城市背后的秘密...',
      foreshadowing: [{ id: '1', content: '神秘的青铜钥匙', chapter: 0, isCollected: false, createdAt: Date.now() }],
      chapters: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
    
    // 加载数据
    const loadData = () => {
      const saved = localStorage.getItem('novel_platform_data');
      const savedApiKey = localStorage.getItem('ai_api_key');
      const savedStyleSamples = localStorage.getItem('style_samples');
      const savedMode = localStorage.getItem('writing_mode');
      
      let initialState: AppState = {
        novels: {},
        activeNovelId: null,
        mode: (savedMode as 'active' | 'auto') || 'active',
        isAutoRunning: false,
        beats: null,
        showBeatEditor: false,
        isGenerating: false,
        progress: 0,
        tellSentences: [],
        showTellPanel: false,
        sidebarCollapsed: false,
        rightPanelTab: 'tell',
        apiKey: savedApiKey || '',
        styleSamples: savedStyleSamples ? JSON.parse(savedStyleSamples) : [],
        customPrompt: '',
        showSettings: false,
        showNovelManager: false,
        abortController: null
      };
      
      if (saved) {
        try {
          const data = JSON.parse(saved);
          initialState.novels = data.novels || {};
          initialState.activeNovelId = data.activeNovelId || null;
        } catch {
          // 如果数据损坏，创建一个新小说
          const newNovel = createNewNovel('我的新小说');
          initialState.novels[newNovel.id] = newNovel;
          initialState.activeNovelId = newNovel.id;
        }
      } else {
        // 首次使用，创建示例小说
        const newNovel = createNewNovel('我的新小说');
        initialState.novels[newNovel.id] = newNovel;
        initialState.activeNovelId = newNovel.id;
      }
      
      return initialState;
    };
    
    // 保存数据
    const saveData = (state) => {
      localStorage.setItem('novel_platform_data', JSON.stringify({
        novels: state.novels,
        activeNovelId: state.activeNovelId
      }));
    };
    
    // 主应用组件
    function App() {
      const [state, setState] = React.useState<AppState>(loadData);
      
      // 获取当前小说
      const currentNovel = state.activeNovelId ? state.novels[state.activeNovelId] : null;
      
      // 检查存储空间
      const getStorageUsed = () => {
        let total = 0;
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key) total += localStorage.getItem(key)?.length || 0;
        }
        return total;
      };
      
      // 压缩记忆库
      const compressMemory = () => {
        if (!currentNovel) return '';
        
        const compressed = {
          characters: currentNovel.characters.map(char => ({
            name: char.name,
            identity: char.identity,
            personality: char.personality,
            skills: char.skills,
            latestStatus: char.status.slice(-3)
          })),
          worldSetting: currentNovel.worldSetting.substring(0, 500),
          outline: currentNovel.outline.substring(0, 300),
          foreshadowing: currentNovel.foreshadowing
            .filter(f => !f.isCollected)
            .map(f => ({ id: f.id, content: f.content.substring(0, 50) }))
        };
        
        const jsonStr = JSON.stringify(compressed);
        return jsonStr.length > 2000 ? jsonStr.substring(0, 2000) + '...' : jsonStr;
      };
      
      // 构建Prompt
      const buildPrompt = (contentType, customBeats?) => {
        const memory = compressMemory();
        let prompt = '';
        
        // 基础去AI味规范
        prompt += `【写作规范】
1. 禁止使用以下词汇：${FORBIDDEN_WORDS.join('、')}
2. 禁止连续使用"XX地"结构（如：冷静地说、快速地跑）
3. 副词密度：每300字不超过2个
4. 每段至少包含1个具体感官细节（视觉/听觉/触觉/嗅觉）
5. 多用"展示"少用"告知"（不说"他很生气"，写"他捏碎了酒杯"）

`;
        
        // 文风样本
        const enabledSample = state.styleSamples.find(s => s.enabled);
        if (enabledSample) {
          prompt += `【文风样本】
请严格模仿以下文风样本的语气、句式节奏、用词习惯：
${enabledSample.content}

`;
        }
        
        // 故事设定
        prompt += `【故事设定】
${memory}

`;
        
        // 上下文
        if (currentNovel?.chapters.length > 0) {
          const lastChapter = currentNovel.chapters[currentNovel.chapters.length - 1];
          prompt += `【前文概要】${lastChapter.content.substring(0, 500)}

`;
        }
        
        if (contentType === 'beats') {
          prompt += '请为下一章生成节拍表，输出JSON格式：{beats: [{step: "核心冲突", emotion: "情感转折点", wordCount: 预估字数}], summary: "本段一句话概括"}';
        } else {
          const beatsStr = JSON.stringify(customBeats);
          const extraPrompt = state.customPrompt;
          prompt += `【节拍表】
${beatsStr}

${extraPrompt ? `【额外要求】${extraPrompt}` : ''}

输出纯正文，不要任何格式标记。`;
        }
        
        return prompt;
      };
      
      // 调用API
      const callAPI = async (prompt) => {
        return new Promise((resolve, reject) => {
          if (!state.apiKey || state.apiKey.trim() === '') {
            setTimeout(() => {
              if (prompt.includes('节拍表')) {
                resolve(JSON.stringify(generateMockBeats()));
              } else {
                resolve(generateMockContent());
              }
            }, 1500);
            return;
          }
          
          const abortController = new AbortController();
          setState(prev => ({ ...prev, abortController }));
          
          fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.apiKey}`
            },
            body: JSON.stringify({
              model: AI_MODEL,
              messages: [{ role: 'user', content: prompt }],
              stream: false
            }),
            signal: abortController.signal
          })
          .then(res => {
            if (!res.ok) throw new Error(`HTTP错误: ${res.status}`);
            return res.json();
          })
          .then(data => {
            if (data.choices && data.choices[0]?.message?.content) {
              resolve(data.choices[0].message.content);
            } else {
              reject(data.error?.message || 'API返回格式错误');
            }
          })
          .catch(err => {
            if (err.name === 'AbortError') {
              reject('请求已取消');
            } else if (err.message.includes('CORS')) {
              reject('CORS错误：当前环境不支持跨域请求，请使用演示模式');
            } else {
              reject(err.message);
            }
          });
        });
      };
      
      // 生成节拍表
      const generateBeats = async () => {
        setState(prev => ({ ...prev, isGenerating: true, progress: 0 }));
        
        const interval = setInterval(() => {
          setState(prev => ({ ...prev, progress: Math.min(prev.progress + 10, 90) }));
        }, 100);
        
        try {
          const prompt = buildPrompt('beats');
          const result = await callAPI(prompt);
          const beatsData = JSON.parse(result);
          setState(prev => ({ ...prev, beats: beatsData, showBeatEditor: true }));
        } catch (err) {
          alert(`生成失败: ${err}`);
        } finally {
          clearInterval(interval);
          setState(prev => ({ ...prev, progress: 100, isGenerating: false }));
        }
      };
      
      // 生成正文
      const generateContent = async () => {
        if (!state.beats) return;
        
        setState(prev => ({ ...prev, isGenerating: true, progress: 0 }));
        
        const interval = setInterval(() => {
          setState(prev => ({ ...prev, progress: Math.min(prev.progress + 5, 95) }));
        }, 100);
        
        try {
          const prompt = buildPrompt('content', state.beats);
          const result = await callAPI(prompt);
          
          const newChapter = {
            index: (currentNovel?.chapters.length || 0) + 1,
            content: result,
            beats: state.beats.beats,
            timestamp: Date.now(),
            wordCount: result.length
          };
          
          setState(prev => {
            const novels = { ...prev.novels };
            novels[prev.activeNovelId] = {
              ...novels[prev.activeNovelId],
              chapters: [...novels[prev.activeNovelId].chapters, newChapter],
              updatedAt: Date.now()
            };
            return { ...prev, novels, beats: null, showBeatEditor: false };
          });
          
          // 检测告知句
          detectTellSentences(result);
        } catch (err) {
          alert(`生成失败: ${err}`);
        } finally {
          clearInterval(interval);
          setState(prev => ({ ...prev, progress: 100, isGenerating: false }));
        }
      };
      
      // 检测告知句
      const detectTellSentences = (content) => {
        const patterns = [
          /(感到|觉得|非常|很|特别)\s+(开心|难过|愤怒|悲伤|高兴|失望|惊讶|恐惧|焦虑|紧张)/g,
          /脸上露出(.*?)表情/g,
          /心里(.*?)(开心|难过|愤怒|悲伤|高兴|失望|惊讶|恐惧)/g
        ];
        
        const sentences = [];
        patterns.forEach(pattern => {
          let match;
          while ((match = pattern.exec(content)) !== null) {
            sentences.push({
              original: match[0],
              rewrite: generateMockRewrite(match[0]),
              status: 'pending',
              id: Date.now().toString() + Math.random()
            });
          }
        });
        
        if (sentences.length > 0) {
          setState(prev => ({ ...prev, tellSentences: sentences, showTellPanel: true }));
        }
      };
      
      // 处理告知句
      const handleTellAction = (id, action, newRewrite) => {
        setState(prev => ({
          ...prev,
          tellSentences: prev.tellSentences.map(s => {
            if (s.id === id) {
              return {
                ...s,
                status: action === 'edit' ? 'pending' : (action === 'adopt' ? 'adopted' : 'skipped'),
                rewrite: newRewrite || s.rewrite
              };
            }
            return s;
          })
        }));
      };
      
      const adoptAllTells = () => {
        setState(prev => ({ ...prev, tellSentences: prev.tellSentences.map(s => ({ ...s, status: 'adopted' })) }));
        applyTellChanges();
      };
      
      const skipAllTells = () => {
        setState(prev => ({ ...prev, tellSentences: [], showTellPanel: false }));
        if (state.isAutoRunning) {
          setTimeout(startAutoChapter, 500);
        }
      };
      
      const applyTellChanges = () => {
        if (!currentNovel || currentNovel.chapters.length === 0) return;
        
        let content = currentNovel.chapters[currentNovel.chapters.length - 1].content;
        state.tellSentences.forEach(s => {
          if (s.status === 'adopted') {
            content = content.replace(s.original, s.rewrite);
          }
        });
        
        setState(prev => {
          const novels = { ...prev.novels };
          novels[prev.activeNovelId] = {
            ...novels[prev.activeNovelId],
            chapters: novels[prev.activeNovelId].chapters.map((ch, i) => 
              i === novels[prev.activeNovelId].chapters.length - 1 ? { ...ch, content } : ch
            )
          };
          return { ...prev, novels, tellSentences: [], showTellPanel: false };
        }, () => {
          saveData({ ...state, tellSentences: [], showTellPanel: false });
          if (state.isAutoRunning) {
            setTimeout(startAutoChapter, 500);
          }
        });
      };
      
      // 自动续写
      const startAutoChapter = async () => {
        if (!state.isAutoRunning || state.showTellPanel) return;
        
        try {
          setState(prev => ({ ...prev, isGenerating: true }));
          
          const beatsPrompt = buildPrompt('beats');
          const beatsResult = await callAPI(beatsPrompt);
          const beatsData = JSON.parse(beatsResult);
          
          const contentPrompt = buildPrompt('content', beatsData);
          const contentResult = await callAPI(contentPrompt);
          
          const newChapter = {
            index: (currentNovel?.chapters.length || 0) + 1,
            content: contentResult,
            beats: beatsData.beats,
            timestamp: Date.now(),
            wordCount: contentResult.length
          };
          
          setState(prev => {
            const novels = { ...prev.novels };
            novels[prev.activeNovelId] = {
              ...novels[prev.activeNovelId],
              chapters: [...novels[prev.activeNovelId].chapters, newChapter],
              updatedAt: Date.now()
            };
            return { ...prev, novels };
          });
          
          detectTellSentences(contentResult);
        } catch (err) {
          alert(`自动续写失败: ${err}`);
          setState(prev => ({ ...prev, isAutoRunning: false }));
        } finally {
          setState(prev => ({ ...prev, isGenerating: false }));
        }
      };
      
      const toggleAutoMode = () => {
        setState(prev => {
          const newState = { ...prev, isAutoRunning: !prev.isAutoRunning };
          if (newState.isAutoRunning) {
            setTimeout(startAutoChapter, 500);
          }
          return newState;
        });
      };
      
      // 创建新小说
      const createNovel = (title) => {
        const newNovel = createNewNovel(title);
        setState(prev => ({
          ...prev,
          novels: { ...prev.novels, [newNovel.id]: newNovel },
          activeNovelId: newNovel.id,
          showNovelManager: false
        }));
      };
      
      // 删除小说
      const deleteNovel = (id) => {
        if (!confirm('确定删除这本小说吗？')) return;
        
        setState(prev => {
          const novels = { ...prev.novels };
          delete novels[id];
          const novelIds = Object.keys(novels);
          return {
            ...prev,
            novels,
            activeNovelId: prev.activeNovelId === id ? (novelIds[0] || null) : prev.activeNovelId
          };
        });
      };
      
      // 重命名小说
      const renameNovel = (id, newName) => {
        setState(prev => {
          const novels = { ...prev.novels };
          novels[id] = { ...novels[id], title: newName };
          return { ...prev, novels };
        });
      };
      
      // 导出Word
      const exportWord = () => {
        if (!currentNovel) return;
        
        let content = `标题：${currentNovel.title}\n\n`;
        content += `大纲：\n${currentNovel.outline}\n\n`;
        content += `角色：\n${currentNovel.characters.map(c => `${c.name} - ${c.identity}`).join('\n')}\n\n`;
        content += `世界观：\n${currentNovel.worldSetting}\n\n`;
        content += '=== 章节 ===\n\n';
        
        currentNovel.chapters.forEach(chapter => {
          content += `第${chapter.index}章\n${chapter.content}\n\n---\n\n`;
        });
        
        const blob = new Blob([content], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentNovel.title}.doc`;
        a.click();
        URL.revokeObjectURL(url);
      };
      
      // 导入文件
      const importFile = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.doc,.txt';
        input.onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (event) => {
            const content = event.target?.result as string;
            const confirmAppend = confirm('是否追加到当前作品？（取消则覆盖）');
            
            if (confirmAppend && currentNovel) {
              setState(prev => {
                const novels = { ...prev.novels };
                novels[prev.activeNovelId] = {
                  ...novels[prev.activeNovelId],
                  chapters: [
                    ...novels[prev.activeNovelId].chapters,
                    {
                      index: novels[prev.activeNovelId].chapters.length + 1,
                      content,
                      beats: [],
                      timestamp: Date.now(),
                      wordCount: content.length
                    }
                  ],
                  updatedAt: Date.now()
                };
                return { ...prev, novels };
              });
            } else {
              const newNovel = createNewNovel('导入的作品');
              newNovel.chapters = [{
                index: 1,
                content,
                beats: [],
                timestamp: Date.now(),
                wordCount: content.length
              }];
              setState(prev => ({
                ...prev,
                novels: { ...prev.novels, [newNovel.id]: newNovel },
                activeNovelId: newNovel.id
              }));
            }
            alert('导入成功');
          };
          reader.readAsText(file);
        };
        input.click();
      };
      
      // 保存API Key
      const saveApiKey = (key) => {
        setState(prev => ({ ...prev, apiKey: key }));
        localStorage.setItem('ai_api_key', key);
      };
      
      // 保存模式设置
      const saveMode = (newMode) => {
        setState(prev => ({ ...prev, mode: newMode }));
        localStorage.setItem('writing_mode', newMode);
      };
      
      // 添加文风样本
      const addStyleSample = (name, content) => {
        setState(prev => {
          const newSamples = [...prev.styleSamples, {
            id: Date.now().toString(),
            name: name || content.substring(0, 20),
            content,
            enabled: prev.styleSamples.length === 0
          }].slice(-3);
          localStorage.setItem('style_samples', JSON.stringify(newSamples));
          return { ...prev, styleSamples: newSamples };
        });
      };
      
      // 更新文风样本
      const updateStyleSample = (id, updates) => {
        setState(prev => {
          const newSamples = prev.styleSamples.map(s => 
            s.id === id ? { ...s, ...updates } : s
          );
          localStorage.setItem('style_samples', JSON.stringify(newSamples));
          return { ...prev, styleSamples: newSamples };
        });
      };
      
      // 删除文风样本
      const deleteStyleSample = (id) => {
        setState(prev => {
          const newSamples = prev.styleSamples.filter(s => s.id !== id);
          localStorage.setItem('style_samples', JSON.stringify(newSamples));
          return { ...prev, styleSamples: newSamples };
        });
      };
      
      // 启用文风样本（禁用其他）
      const enableStyleSample = (id) => {
        setState(prev => {
          const newSamples = prev.styleSamples.map(s => ({
            ...s,
            enabled: s.id === id
          }));
          localStorage.setItem('style_samples', JSON.stringify(newSamples));
          return { ...prev, styleSamples: newSamples };
        });
      };
      
      // 矛盾检测
      const runConflictCheck = () => {
        if (!currentNovel) return;
        
        const reports = [];
        
        // 检查性格矛盾
        currentNovel.characters.forEach(char => {
          currentNovel.chapters.forEach(chapter => {
            char.personality.forEach(trait => {
              if (trait.includes('冷静') && chapter.content.includes('冲动')) {
                reports.push({
                  position: `第${chapter.index}章`,
                  type: '性格矛盾',
                  content: `${char.name}表现出冲动行为`,
                  reason: `角色设定为${trait}，但行为不符`,
                  suggestion: '调整角色行为或修改设定'
                });
              }
            });
          });
        });
        
        // 检查伏笔
        const uncollected = currentNovel.foreshadowing.filter(f => !f.isCollected);
        if (uncollected.length > 3) {
          reports.push({
            position: '全局',
            type: '伏笔未回收',
            content: `${uncollected.length}个伏笔未收束`,
            reason: '过多未回收伏笔可能导致读者困惑',
            suggestion: '考虑在后续章节回收部分伏笔'
          });
        }
        
        alert(reports.length > 0 
          ? reports.map(r => `${r.type}: ${r.content}\n${r.suggestion}`).join('\n\n')
          : '未检测到矛盾！'
        );
      };
      
      // 添加角色
      const addCharacter = () => {
        const name = prompt('角色名称：');
        if (!name) return;
        
        setState(prev => {
          const novels = { ...prev.novels };
          novels[prev.activeNovelId] = {
            ...novels[prev.activeNovelId],
            characters: [
              ...novels[prev.activeNovelId].characters,
              {
                id: Date.now().toString(),
                name,
                identity: '待设定',
                skills: [],
                personality: [],
                speechStyle: '待设定',
                status: ['待设定'],
                statusHistory: [{ timestamp: Date.now(), status: '待设定' }]
              }
            ]
          };
          return { ...prev, novels };
        });
      };
      
      // 更新角色
      const updateCharacter = (id, field, value) => {
        setState(prev => {
          const novels = { ...prev.novels };
          novels[prev.activeNovelId] = {
            ...novels[prev.activeNovelId],
            characters: novels[prev.activeNovelId].characters.map(c =>
              c.id === id ? { ...c, [field]: value } : c
            )
          };
          return { ...prev, novels };
        });
      };
      
      // 添加伏笔
      const addForeshadowing = () => {
        const content = prompt('伏笔内容：');
        if (!content) return;
        
        setState(prev => {
          const novels = { ...prev.novels };
          novels[prev.activeNovelId] = {
            ...novels[prev.activeNovelId],
            foreshadowing: [
              ...novels[prev.activeNovelId].foreshadowing,
              {
                id: Date.now().toString(),
                content,
                chapter: novels[prev.activeNovelId].chapters.length,
                isCollected: false,
                createdAt: Date.now()
              }
            ]
          };
          return { ...prev, novels };
        });
      };
      
      // 回收伏笔
      const collectForeshadowing = (id) => {
        setState(prev => {
          const novels = { ...prev.novels };
          novels[prev.activeNovelId] = {
            ...novels[prev.activeNovelId],
            foreshadowing: novels[prev.activeNovelId].foreshadowing.map(f =>
              f.id === id ? { ...f, isCollected: true } : f
            )
          };
          return { ...prev, novels };
        });
      };
      
      // 渲染章节
      const renderChapter = (chapter) => (
        <div key={chapter.index} className="chapter-card mb-8 p-4">
          <div className="flex items-center gap-2 mb-4">
            <span className="px-3 py-1 bg-orange-500 text-white text-sm font-bold">第{chapter.index}章</span>
            <span className="text-gray-500 text-sm">
              {new Date(chapter.timestamp).toLocaleDateString()} | {chapter.wordCount}字
            </span>
          </div>
          <div className="whitespace-pre-wrap leading-relaxed">
            {chapter.content}
          </div>
        </div>
      );
      
      // 渲染角色卡片
      const renderCharacterCard = (char) => (
        <div key={char.id} className="bg-white border-2 border-black p-4 mb-3">
          <div className="flex justify-between items-start mb-2">
            <h4 className="font-bold text-lg">{char.name}</h4>
            <button 
              onClick={() => addForeshadowing()}
              className="text-blue-500 hover:text-blue-700"
            >+</button>
          </div>
          <div className="space-y-2 text-sm">
            <div>
              <span className="text-gray-500">身份：</span>
              <input
                type="text"
                value={char.identity}
                onChange={(e) => updateCharacter(char.id, 'identity', e.target.value)}
                className="brutalist-input text-sm w-full mt-1"
              />
            </div>
            <div>
              <span className="text-gray-500">技能：</span>
              <input
                type="text"
                value={char.skills.join(', ')}
                onChange={(e) => updateCharacter(char.id, 'skills', e.target.value.split(',').map(s => s.trim()).filter(Boolean))}
                className="brutalist-input text-sm w-full mt-1"
                placeholder="技能1, 技能2"
              />
            </div>
            <div>
              <span className="text-gray-500">性格：</span>
              <input
                type="text"
                value={char.personality.join(', ')}
                onChange={(e) => updateCharacter(char.id, 'personality', e.target.value.split(',').map(s => s.trim()).filter(Boolean))}
                className="brutalist-input text-sm w-full mt-1"
                placeholder="性格1, 性格2"
              />
            </div>
            <div>
              <span className="text-gray-500">说话风格：</span>
              <input
                type="text"
                value={char.speechStyle}
                onChange={(e) => updateCharacter(char.id, 'speechStyle', e.target.value)}
                className="brutalist-input text-sm w-full mt-1"
              />
            </div>
          </div>
        </div>
      );
      
      // 保存到localStorage
      React.useEffect(() => {
        saveData(state);
      }, [state.novels, state.activeNovelId]);
      
      if (!currentNovel) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <h1 className="text-2xl font-bold mb-4">没有找到小说</h1>
              <button 
                onClick={() => createNovel('我的新小说')}
                className="brutalist-btn"
              >
                + 新建小说
              </button>
            </div>
          </div>
        );
      }
      
      return (
        <div className="min-h-screen flex flex-col">
          {/* 顶部栏 */}
          <header className="bg-white border-b-3 border-black px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              {/* 作品选择器 */}
              <div className="flex items-center gap-3">
                <select
                  value={state.activeNovelId}
                  onChange={(e) => setState(prev => ({ ...prev, activeNovelId: e.target.value }))}
                  className="brutalist-input text-lg font-bold"
                  style={{ fontFamily: 'Inter, sans-serif' }}
                >
                  {Object.values(state.novels).map(novel => (
                    <option key={novel.id} value={novel.id}>{novel.title}</option>
                  ))}
                </select>
                
                <button 
                  onClick={() => setState(prev => ({ ...prev, showNovelManager: true }))}
                  className="brutalist-btn-secondary"
                >
                  管理
                </button>
                
                <button 
                  onClick={() => {
                    const title = prompt('请输入新作品名称：');
                    if (title) createNovel(title);
                  }}
                  className="brutalist-btn"
                >
                  + 新建
                </button>
              </div>
              
              {/* 右侧按钮 */}
              <div className="flex items-center gap-3">
                <button onClick={exportWord} className="brutalist-btn-secondary">
                  📄 导出Word
                </button>
                <button onClick={importFile} className="brutalist-btn-secondary">
                  📥 导入
                </button>
                <button 
                  onClick={() => setState(prev => ({ ...prev, showSettings: true }))}
                  className="brutalist-btn-secondary"
                >
                  ⚙ 设置
                </button>
              </div>
            </div>
          </header>
          
          {/* 主内容区 */}
          <div className="flex flex-1 overflow-hidden">
            {/* 左侧边栏 */}
            <aside className={`${state.sidebarCollapsed ? 'w-12' : 'w-72'} sidebar-bg flex flex-col transition-all duration-300`}>
              <button
                onClick={() => setState(prev => ({ ...prev, sidebarCollapsed: !prev.sidebarCollapsed }))}
                className="p-3 border-b border-white/20 hover:bg-white/10"
              >
                {state.sidebarCollapsed ? '▶' : '◀'}
              </button>
              
              <div className={`${state.sidebarCollapsed ? 'hidden' : 'block'} flex-1 overflow-y-auto p-4 space-y-6`}>
                {/* 故事大纲 */}
                <div>
                  <h3 className="font-bold mb-2 flex items-center gap-2">
                    📖 故事大纲
                  </h3>
                  <textarea
                    value={currentNovel.outline}
                    onChange={(e) => {
                      setState(prev => {
                        const novels = { ...prev.novels };
                        novels[prev.activeNovelId] = { ...novels[prev.activeNovelId], outline: e.target.value };
                        return { ...prev, novels };
                      });
                    }}
                    className="w-full bg-white/10 border border-white/30 text-white p-3 resize-none rounded"
                    rows={4}
                  />
                </div>
                
                {/* 角色档案 */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <h3 className="font-bold flex items-center gap-2">
                      👥 角色档案
                    </h3>
                    <button onClick={addCharacter} className="text-blue-300 hover:text-blue-100">+</button>
                  </div>
                  <div className="space-y-2">
                    {currentNovel.characters.map(renderCharacterCard)}
                  </div>
                </div>
                
                {/* 世界观 */}
                <div>
                  <h3 className="font-bold mb-2 flex items-center gap-2">
                    🌍 世界观
                  </h3>
                  <textarea
                    value={currentNovel.worldSetting}
                    onChange={(e) => {
                      setState(prev => {
                        const novels = { ...prev.novels };
                        novels[prev.activeNovelId] = { ...novels[prev.activeNovelId], worldSetting: e.target.value };
                        return { ...prev, novels };
                      });
                    }}
                    className="w-full bg-white/10 border border-white/30 text-white p-3 resize-none rounded"
                    rows={4}
                  />
                </div>
                
                {/* 伏笔清单 */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <h3 className="font-bold flex items-center gap-2">
                      🚩 伏笔清单
                    </h3>
                    <button onClick={addForeshadowing} className="text-blue-300 hover:text-blue-100">+</button>
                  </div>
                  <div className="space-y-2">
                    {currentNovel.foreshadowing
                      .filter(f => !f.isCollected)
                      .map(f => (
                        <div key={f.id} className="bg-orange-500/20 p-2 rounded">
                          <div className="flex justify-between">
                            <span className="text-sm">{f.content}</span>
                            <button 
                              onClick={() => collectForeshadowing(f.id)}
                              className="text-green-300 hover:text-green-100 text-xs"
                            >✓ 回收</button>
                          </div>
                          <span className="text-xs text-gray-400">第{f.chapter}章</span>
                        </div>
                      ))}
                    {currentNovel.foreshadowing.filter(f => !f.isCollected).length === 0 && (
                      <p className="text-gray-400 text-sm">暂无未收束伏笔</p>
                    )}
                  </div>
                </div>
                
                {/* 矛盾检测 */}
                <button 
                  onClick={runConflictCheck}
                  className="w-full py-2 bg-red-500/20 border border-red-400/50 text-red-300 hover:bg-red-500/30 transition-colors"
                >
                  ⚠ 矛盾检测
                </button>
                
                {/* 存储空间 */}
                <div>
                  <h3 className="font-bold mb-2 flex items-center gap-2">💾 存储空间</h3>
                  <div className="w-full bg-white/10 h-2 rounded">
                    <div 
                      className="h-full bg-blue-400 rounded"
                      style={{ width: `${Math.min((getStorageUsed() / STORAGE_LIMIT) * 100, 100)}%` }}
                    ></div>
                  </div>
                  <div className="flex justify-between text-xs text-gray-400 mt-1">
                    <span>{(getStorageUsed() / 1024 / 1024).toFixed(2)} MB</span>
                    <span>/ 5 MB</span>
                  </div>
                </div>
              </div>
            </aside>
            
            {/* 中央创作区 */}
            <main className="flex-1 overflow-y-auto p-6">
              <div className="max-w-3xl mx-auto">
                {/* 历史章节 */}
                {currentNovel.chapters.length === 0 ? (
                  <div className="text-center py-20">
                    <div className="text-6xl mb-4">📝</div>
                    <h2 className="text-xl font-bold mb-2">开始你的故事</h2>
                    <p className="text-gray-500">点击下方按钮生成第一个章节</p>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {currentNovel.chapters.map(renderChapter)}
                  </div>
                )}
                
                {/* 节拍表编辑器 */}
                {state.showBeatEditor && state.beats && (
                  <div className="brutalist-card p-6 mb-6">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="text-lg font-bold" style={{ fontFamily: 'Inter, sans-serif' }}>节拍表编辑</h3>
                      <button 
                        onClick={() => setState(prev => ({ ...prev, showBeatEditor: false }))}
                        className="text-gray-500 hover:text-gray-700"
                      >✕</button>
                    </div>
                    
                    <div className="mb-4">
                      <label className="block text-sm font-medium mb-1">章节概括</label>
                      <input
                        type="text"
                        value={state.beats.summary}
                        onChange={(e) => setState(prev => ({ 
                          ...prev, 
                          beats: prev.beats ? { ...prev.beats, summary: e.target.value } : null 
                        }))}
                        className="brutalist-input w-full"
                      />
                    </div>
                    
                    <div className="space-y-3 mb-4">
                      {state.beats.beats.map(beat => (
                        <div key={beat.id} className="flex gap-3 items-end">
                          <div className="flex-1">
                            <label className="block text-sm font-medium mb-1">核心冲突</label>
                            <input
                              type="text"
                              value={beat.step}
                              onChange={(e) => setState(prev => ({
                                ...prev,
                                beats: prev.beats ? {
                                  ...prev.beats,
                                  beats: prev.beats.beats.map(b => 
                                    b.id === beat.id ? { ...b, step: e.target.value } : b
                                  )
                                } : null
                              }))}
                              className="brutalist-input w-full"
                            />
                          </div>
                          <div className="w-32">
                            <label className="block text-sm font-medium mb-1">情感转折</label>
                            <input
                              type="text"
                              value={beat.emotion}
                              onChange={(e) => setState(prev => ({
                                ...prev,
                                beats: prev.beats ? {
                                  ...prev.beats,
                                  beats: prev.beats.beats.map(b => 
                                    b.id === beat.id ? { ...b, emotion: e.target.value } : b
                                  )
                                } : null
                              }))}
                              className="brutalist-input w-full"
                            />
                          </div>
                          <div className="w-20">
                            <label className="block text-sm font-medium mb-1">字数</label>
                            <input
                              type="number"
                              value={beat.wordCount}
                              onChange={(e) => setState(prev => ({
                                ...prev,
                                beats: prev.beats ? {
                                  ...prev.beats,
                                  beats: prev.beats.beats.map(b => 
                                    b.id === beat.id ? { ...b, wordCount: parseInt(e.target.value) || 0 } : b
                                  )
                                } : null
                              }))}
                              className="brutalist-input w-full"
                            />
                          </div>
                          <button 
                            onClick={() => setState(prev => ({
                              ...prev,
                              beats: prev.beats ? {
                                ...prev.beats,
                                beats: prev.beats.beats.filter(b => b.id !== beat.id)
                              } : null
                            }))}
                            className="p-2 text-red-500 hover:text-red-700"
                          >✕</button>
                        </div>
                      ))}
                    </div>
                    
                    <button 
                      onClick={() => setState(prev => ({
                        ...prev,
                        beats: prev.beats ? {
                          ...prev.beats,
                          beats: [...prev.beats.beats, { id: Date.now().toString(), step: '', emotion: '', wordCount: 200 }]
                        } : null
                      }))}
                      className="w-full py-2 border-2 border-dashed border-gray-300 text-gray-500 hover:border-orange-400 hover:text-orange-500 mb-4"
                    >
                      + 添加节拍
                    </button>
                    
                    {/* 剧情指令 */}
                    <div className="mb-4">
                      <label className="block text-sm font-medium mb-1">额外剧情指令（可选）</label>
                      <textarea
                        value={state.customPrompt}
                        onChange={(e) => setState(prev => ({ ...prev, customPrompt: e.target.value }))}
                        className="brutalist-input w-full"
                        rows={2}
                      />
                    </div>
                    
                    <button 
                      onClick={generateContent}
                      disabled={state.isGenerating}
                      className="brutalist-btn w-full"
                    >
                      {state.isGenerating ? '⏳ 生成中...' : '✨ 确认生成正文'}
                    </button>
                  </div>
                )}
                
                {/* 生成按钮区域 */}
                {!state.showBeatEditor && (
                  <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-3xl px-4">
                    <div className="brutalist-card p-4">
                      <div className="flex items-center gap-4">
                        <textarea
                          value={state.customPrompt}
                          onChange={(e) => setState(prev => ({ ...prev, customPrompt: e.target.value }))}
                          className="flex-1 brutalist-input"
                          rows={2}
                          placeholder="输入剧情指令（可选）..."
                        />
                        <div className="flex flex-col gap-2">
                          {state.mode === 'active' ? (
                            <button 
                              onClick={generateBeats}
                              disabled={state.isGenerating}
                              className="brutalist-btn"
                            >
                              {state.isGenerating ? '⏳' : '✨'} 续写
                            </button>
                          ) : (
                            <button 
                              onClick={toggleAutoMode}
                              className={`brutalist-btn ${state.isAutoRunning ? 'bg-red-500' : 'bg-green-500'}`}
                            >
                              {state.isAutoRunning ? '⏸ 暂停' : '▶ 开始自动续写'}
                            </button>
                          )}
                        </div>
                      </div>
                      
                      {/* 进度条 */}
                      {state.isGenerating && (
                        <div className="mt-3">
                          <div className="w-full bg-gray-200 h-2">
                            <div 
                              className="h-full bg-orange-500 transition-all"
                              style={{ width: `${state.progress}%` }}
                            ></div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </main>
            
            {/* 右侧面板 */}
            <aside className="w-80 bg-white border-l-3 border-black flex flex-col">
              <div className="flex border-b-2 border-black">
                <button 
                  onClick={() => setState(prev => ({ ...prev, rightPanelTab: 'tell' }))}
                  className={`flex-1 py-3 font-medium transition-colors ${
                    state.rightPanelTab === 'tell' ? 'text-orange-500 border-b-2 border-orange-500' : 'text-gray-500'
                  }`}
                >
                  告知句检测
                </button>
                <button 
                  onClick={() => setState(prev => ({ ...prev, rightPanelTab: 'foreshadowing' }))}
                  className={`flex-1 py-3 font-medium transition-colors ${
                    state.rightPanelTab === 'foreshadowing' ? 'text-orange-500 border-b-2 border-orange-500' : 'text-gray-500'
                  }`}
                >
                  伏笔清单
                </button>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4">
                {state.rightPanelTab === 'tell' ? (
                  <div>
                    {state.showTellPanel && state.tellSentences.length > 0 ? (
                      <>
                        <div className="flex gap-2 mb-4">
                          <button onClick={adoptAllTells} className="flex-1 py-2 bg-green-500 text-white">一键采纳</button>
                          <button onClick={skipAllTells} className="flex-1 py-2 bg-gray-200">批量跳过</button>
                        </div>
                        <div className="space-y-3">
                          {state.tellSentences.map(sentence => (
                            <div key={sentence.id} className="bg-gray-100 p-3">
                              <p className="text-sm line-through text-gray-500">{sentence.original}</p>
                              <input
                                type="text"
                                value={sentence.rewrite}
                                onChange={(e) => handleTellAction(sentence.id, 'edit', e.target.value)}
                                className="brutalist-input text-sm w-full mt-1"
                              />
                              <div className="flex gap-2 mt-2">
                                <button 
                                  onClick={() => handleTellAction(sentence.id, 'adopt')}
                                  className="flex-1 py-1 bg-green-500 text-white text-xs"
                                >采纳</button>
                                <button 
                                  onClick={() => handleTellAction(sentence.id, 'skip')}
                                  className="flex-1 py-1 bg-gray-200 text-xs"
                                >跳过</button>
                              </div>
                            </div>
                          ))}
                        </div>
                        {state.tellSentences.filter(s => s.status === 'pending').length === 0 && (
                          <button onClick={applyTellChanges} className="w-full mt-4 brutalist-btn">
                            应用更改
                          </button>
                        )}
                      </>
                    ) : (
                      <div className="text-center py-12">
                        <div className="text-4xl mb-3">✅</div>
                        <p className="text-gray-500">暂无待处理的告知句</p>
                      </div>
                    )}
                  </div>
                ) : (
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="font-medium">未收束伏笔</span>
                      <span className="px-2 py-0.5 bg-orange-100 text-orange-600 text-xs">
                        {currentNovel.foreshadowing.filter(f => !f.isCollected).length}
                      </span>
                    </div>
                    <div className="space-y-2">
                      {currentNovel.foreshadowing
                        .filter(f => !f.isCollected)
                        .map(f => (
                          <div key={f.id} className="bg-orange-50 p-3">
                            <p className="text-sm">{f.content}</p>
                            <button 
                              onClick={() => collectForeshadowing(f.id)}
                              className="text-green-500 text-xs mt-1"
                            >标记回收</button>
                          </div>
                        ))}
                    </div>
                    
                    <div className="border-t border-gray-200 pt-3 mt-3">
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-medium">已回收</span>
                        <span className="px-2 py-0.5 bg-green-100 text-green-600 text-xs">
                          {currentNovel.foreshadowing.filter(f => f.isCollected).length}
                        </span>
                      </div>
                      <div className="space-y-2">
                        {currentNovel.foreshadowing
                          .filter(f => f.isCollected)
                          .map(f => (
                            <div key={f.id} className="bg-gray-50 p-3">
                              <p className="text-sm text-gray-500 line-through">{f.content}</p>
                            </div>
                          ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </aside>
          </div>
          
          {/* 作品管理弹窗 */}
          {state.showNovelManager && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
              <div className="brutalist-card p-6 max-w-md w-full mx-4">
                <h3 className="text-lg font-bold mb-4" style={{ fontFamily: 'Inter, sans-serif' }}>管理作品</h3>
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {Object.values(state.novels).map(novel => (
                    <div key={novel.id} className="flex items-center justify-between p-2 bg-gray-50">
                      <span className={state.activeNovelId === novel.id ? 'font-bold' : ''}>
                        {novel.title}
                      </span>
                      <div className="flex gap-2">
                        <button 
                          onClick={() => {
                            const newName = prompt('新名称：', novel.title);
                            if (newName) renameNovel(novel.id, newName);
                          }}
                          className="text-blue-500 text-sm"
                        >重命名</button>
                        <button 
                          onClick={() => deleteNovel(novel.id)}
                          className="text-red-500 text-sm"
                        >删除</button>
                      </div>
                    </div>
                  ))}
                </div>
                <button 
                  onClick={() => setState(prev => ({ ...prev, showNovelManager: false }))}
                  className="brutalist-btn w-full mt-4"
                >
                  关闭
                </button>
              </div>
            </div>
          )}
          
          {/* 设置弹窗 */}
          {state.showSettings && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
              <div className="brutalist-card p-6 max-w-lg w-full mx-4 max-h-[80vh] overflow-y-auto">
                <h3 className="text-lg font-bold mb-6" style={{ fontFamily: 'Inter, sans-serif' }}>设置</h3>
                
                {/* 模式设置 */}
                <div className="mb-6">
                  <h4 className="font-medium mb-3">写作模式</h4>
                  <div className="flex gap-4">
                    <label className="flex items-center gap-2">
                      <input
                        type="radio"
                        checked={state.mode === 'active'}
                        onChange={() => saveMode('active')}
                        className="accent-orange-500"
                      />
                      <span>主动模式</span>
                    </label>
                    <label className="flex items-center gap-2">
                      <input
                        type="radio"
                        checked={state.mode === 'auto'}
                        onChange={() => saveMode('auto')}
                        className="accent-orange-500"
                      />
                      <span>自动续写模式</span>
                    </label>
                  </div>
                </div>
                
                {/* 文风样本 */}
                <div className="mb-6">
                  <h4 className="font-medium mb-2">文风样本</h4>
                  <p className="text-sm text-gray-500 mb-3">
                    粘贴一段你喜欢的小说文字，AI将模仿其语气、节奏、用词习惯生成正文
                  </p>
                  
                  <button 
                    onClick={() => {
                      const name = prompt('样本名称：');
                      const content = prompt('样本内容：');
                      if (content) addStyleSample(name, content);
                    }}
                    className="brutalist-btn-secondary mb-4"
                  >
                    + 新增样本
                  </button>
                  
                  <div className="space-y-3">
                    {state.styleSamples.map(sample => (
                      <div key={sample.id} className="bg-gray-50 p-3">
                        <div className="flex items-center justify-between mb-2">
                          <input
                            type="text"
                            value={sample.name}
                            onChange={(e) => updateStyleSample(sample.id, { name: e.target.value })}
                            className="brutalist-input text-sm w-48"
                          />
                          <label className="flex items-center gap-2">
                            <input
                              type="checkbox"
                              checked={sample.enabled}
                              onChange={() => enableStyleSample(sample.id)}
                              className="accent-orange-500"
                            />
                            <span className="text-sm">启用</span>
                          </label>
                        </div>
                        <p className="text-sm text-gray-500 line-clamp-2">{sample.content.substring(0, 50)}...</p>
                        <div className="flex gap-2 mt-2">
                          <button 
                            onClick={() => {
                              const content = prompt('编辑内容：', sample.content);
                              if (content) updateStyleSample(sample.id, { content });
                            }}
                            className="text-blue-500 text-sm"
                          >编辑</button>
                          <button 
                            onClick={() => deleteStyleSample(sample.id)}
                            className="text-red-500 text-sm"
                          >删除</button>
                        </div>
                      </div>
                    ))}
                    {state.styleSamples.length === 0 && (
                      <p className="text-gray-500 text-sm text-center py-4">暂无文风样本</p>
                    )}
                  </div>
                </div>
                
                {/* API Key */}
                <div className="mb-6">
                  <h4 className="font-medium mb-2">API Key</h4>
                  <div className="flex gap-2">
                    <input
                      type={state.apiKey ? 'password' : 'text'}
                      value={state.apiKey ? `${state.apiKey.substring(0, 4)}****${state.apiKey.substring(state.apiKey.length - 4)}` : ''}
                      onChange={(e) => saveApiKey(e.target.value)}
                      className="brutalist-input flex-1"
                      placeholder="输入API Key（不填则使用演示模式）"
                    />
                    <button className="brutalist-btn">保存</button>
                  </div>
                  <p className="text-xs text-gray-500 mt-1">
                    前往 <a href="https://open.bigmodel.cn" target="_blank" className="text-blue-500">open.bigmodel.cn</a> 获取免费API Key
                  </p>
                </div>
                
                <button 
                  onClick={() => setState(prev => ({ ...prev, showSettings: false }))}
                  className="brutalist-btn w-full"
                >
                  关闭
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
